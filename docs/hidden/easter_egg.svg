<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="glowGrad" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="75%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.3"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background and grid -->
  <rect width="900" height="450" fill="url(#bgGrad)"/>
  <rect width="900" height="450" fill="url(#grid)"/>

  <!-- Glowing outer border -->
  <rect x="15" y="15" width="870" height="420" rx="16" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Holographic scanner line -->
  <line x1="20" y1="225" x2="880" y2="225" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="10 5">
    <animate attributeName="y1" values="30;420;30" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="30;420;30" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- Title block -->
  <rect x="40" y="40" width="820" height="60" rx="8" fill="#0b1329" fill-opacity="0.8" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
  <text x="60" y="77" fill="#38bdf8" font-size="20" font-family="monospace" font-weight="bold" letter-spacing="2">
    ▲ ALOK_MAIN_DECRYPTED.EXE
  </text>
  <text x="840" y="75" fill="#10b981" font-size="14" font-family="monospace" text-anchor="end" filter="url(#glowCyan)">
    ● SYSTEM ONLINE
  </text>

  <!-- Terminal window (Left) -->
  <rect x="40" y="120" width="460" height="290" rx="8" fill="#030712" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Terminal header bar -->
  <path d="M 40 128 A 8 8 0 0 1 48 120 L 492 120 A 8 8 0 0 1 500 128 L 500 150 L 40 150 Z" fill="#0f172a"/>
  <circle cx="60" cy="135" r="5" fill="#ef4444"/>
  <circle cx="75" cy="135" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="135" r="5" fill="#10b981"/>
  <text x="110" y="139" fill="#64748b" font-size="12" font-family="monospace">bash --session=alokyadva26</text>

  <!-- Terminal content -->
  <g transform="translate(60, 180)">
    <text x="0" y="0" fill="#a855f7" font-size="13" font-family="monospace">&gt; bypass --firewall --target="github-profile"</text>
    <text x="0" y="22" fill="#10b981" font-size="13" font-family="monospace">[SUCCESS] Mainframe connection established.</text>
    <text x="0" y="44" fill="#38bdf8" font-size="13" font-family="monospace">&gt; decrypt --intelligence-core</text>
    <text x="0" y="66" fill="#facc15" font-size="13" font-family="monospace">[DECRYPTING] .............................. 100%</text>

    <!-- Custom ASCII Art -->
    <text x="0" y="105" fill="#f43f5e" font-size="12" font-family="monospace" font-weight="bold"> ___   _      ___   _  __  __  __ ___   ___ _   _ </text>
    <text x="0" y="118" fill="#ec4899" font-size="12" font-family="monospace" font-weight="bold">/   \ | |    /   \ | |/ /  \ \/ //   \ |   \ \ / / </text>
    <text x="0" y="131" fill="#d946ef" font-size="12" font-family="monospace" font-weight="bold">| - | | |__  | o | |   &lt;    \  / | o | | o  | v /  </text>
    <text x="0" y="144" fill="#8b5cf6" font-size="12" font-family="monospace" font-weight="bold">|_|_| |____| \___/ |_|\_\    \/  \_n_/ |___/  |_|   </text>

    <text x="0" y="185" fill="#10b981" font-size="13" font-family="monospace" filter="url(#glowCyan)">&gt; Congratulations! You found the hidden mainframe. ✨</text>
    <text x="0" y="207" fill="#64748b" font-size="12" font-family="monospace">&gt; Connection idle... Listening on port 8080</text>
    <rect x="270" y="196" width="8" height="13" fill="#10b981">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Spec sheet (Right) -->
  <rect x="520" y="120" width="340" height="290" rx="8" fill="#0b1329" fill-opacity="0.7" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="545" y="155" fill="#f8fafc" font-size="16" font-family="monospace" font-weight="bold" letter-spacing="1">SYSTEM SPECIFICATIONS</text>
  <line x1="545" y1="168" x2="835" y2="168" stroke="#1e293b" stroke-width="2"/>

  <!-- Stats list -->
  <g transform="translate(545, 195)">
    <text x="0" y="0" fill="#94a3b8" font-size="13" font-family="monospace">DEVELOPER ID:</text>
    <text x="130" y="0" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">alokyadva26</text>

    <text x="0" y="25" fill="#94a3b8" font-size="13" font-family="monospace">COGNITIVE LEVEL:</text>
    <text x="130" y="25" fill="#facc15" font-size="13" font-family="monospace" font-weight="bold">Senior Node (99.8%)</text>

    <text x="0" y="50" fill="#94a3b8" font-size="13" font-family="monospace">CORE FOCUS:</text>
    <text x="130" y="50" fill="#f8fafc" font-size="13" font-family="monospace" font-weight="bold">Full Stack + Web3 + DSA</text>

    <text x="0" y="75" fill="#94a3b8" font-size="13" font-family="monospace">DSA RUNTIME:</text>
    <text x="130" y="75" fill="#10b981" font-size="13" font-family="monospace" font-weight="bold">Optimized (O(log N))</text>

    <text x="0" y="100" fill="#94a3b8" font-size="13" font-family="monospace">COFFEE ENGINE:</text>
    <text x="130" y="100" fill="#ec4899" font-size="13" font-family="monospace" font-weight="bold">100% Conversion</text>

    <text x="0" y="125" fill="#94a3b8" font-size="13" font-family="monospace">LOCATION:</text>
    <text x="130" y="125" fill="#38bdf8" font-size="13" font-family="monospace" font-weight="bold">Delhi, India</text>

    <!-- Radar / System Status Indicator -->
    <g transform="translate(0, 150)">
      <rect width="290" height="45" rx="6" fill="#020617" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
      <circle cx="25" cy="22" r="10" fill="none" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="25" cy="22" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="26" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold" letter-spacing="1">DECENTRALIZED NODE SYNCED</text>
    </g>
  </g>
</svg>
