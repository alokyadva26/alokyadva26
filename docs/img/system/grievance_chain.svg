<svg width="760" height="250" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="250"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#12112c"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#38bdf8"/><stop offset="55%" stop-color="#6366f1"/><stop offset="100%" stop-color="#ec4899"/><animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.meta{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#38bdf8}.title{font:900 38px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.desc{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}.tag{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#dbeafe}</style>
  </defs>
  <rect width="760" height="250" rx="24" fill="url(#bg)"/>
  <rect x="6" y="6" width="748" height="238" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="340 86" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-426" dur="16s" repeatCount="indefinite"/></rect>
  <g transform="translate(85 62)" filter="url(#glow)">
    <!-- Blockchain Blocks and Chain links Graphic -->
    <rect x="-40" y="0" width="50" height="50" rx="8" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <rect x="30" y="30" width="50" height="50" rx="8" fill="none" stroke="#6366f1" stroke-width="3"/>
    <rect x="-10" y="60" width="50" height="50" rx="8" fill="none" stroke="#ec4899" stroke-width="3"/>
    <path d="M10 25 L30 55 M80 55 M10 85 M40 80 M-15 50 L-10 60" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/>
    <circle cx="10" cy="25" r="5" fill="#38bdf8"/>
    <circle cx="30" cy="55" r="5" fill="#6366f1"/>
    <circle cx="15" cy="85" r="5" fill="#ec4899"/>
  </g>
  <text x="280" y="74" class="meta">DECENTRALIZED COMPLAINT PORTAL</text>
  <text x="280" y="126" class="title">GRIEVANCE CHAIN</text>
  <text x="280" y="161" class="desc">AI-driven &amp; tamper-proof grievance redressal system on Base Sepolia.</text>
  <g transform="translate(280 190)"><rect width="112" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".45"/><text x="56" y="18" text-anchor="middle" class="tag">BLOCKCHAIN</text></g>
  <g transform="translate(402 190)"><rect width="98" height="26" rx="13" fill="#0f172a" stroke="#6366f1" stroke-opacity=".45"/><text x="49" y="18" text-anchor="middle" class="tag">GEMINI AI</text></g>
</svg>
