<svg width="760" height="250" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="250"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f59e0b"/><stop offset="42%" stop-color="#a78bfa"/><stop offset="72%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#f59e0b"/><animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.meta{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#f59e0b}.title{font:900 38px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.desc{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#c4b5fd}.tag{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#fef3c7}</style>
  </defs>
  <rect width="760" height="250" rx="24" fill="url(#bg)"/>
  <rect x="6" y="6" width="748" height="238" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="340 86" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-426" dur="16s" repeatCount="indefinite"/></rect>
  <g transform="translate(85 62)" filter="url(#glow)">
    <!-- Node-Graph/Stack/Pointers Graphic -->
    <rect x="-30" y="45" width="40" height="20" rx="4" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="-30" y="20" width="40" height="20" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
    <rect x="-30" y="-5" width="40" height="20" rx="4" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    
    <circle cx="45" cy="15" r="10" fill="#f59e0b"/>
    <circle cx="85" cy="-5" r="10" fill="#22d3ee"/>
    <circle cx="85" cy="35" r="10" fill="#a78bfa"/>
    <line x1="45" y1="15" x2="75" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="45" y1="15" x2="75" y2="30" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <text x="280" y="74" class="meta">ALGORITHMS &amp; DATA STRUCTURES</text>
  <text x="280" y="126" class="title">C++ DSA STACK</text>
  <text x="280" y="161" class="desc">Solving complex problems with optimized space &amp; time complexities.</text>
  <g transform="translate(280 190)"><rect width="94" height="26" rx="13" fill="#1e1b4b" stroke="#f59e0b" stroke-opacity=".55"/><text x="47" y="18" text-anchor="middle" class="tag">C++ STDLIB</text></g>
  <g transform="translate(384 190)"><rect width="96" height="26" rx="13" fill="#1e1b4b" stroke="#22d3ee" stroke-opacity=".55"/><text x="48" y="18" text-anchor="middle" class="tag">ALGORITHMS</text></g>
