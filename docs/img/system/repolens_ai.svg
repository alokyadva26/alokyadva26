<svg width="760" height="250" viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="250"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#052e2b"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="45%" stop-color="#22c55e"/><stop offset="75%" stop-color="#67e8f9"/><stop offset="100%" stop-color="#2dd4bf"/><animateTransform attributeName="gradientTransform" type="translate" values="-120 0;120 0;-120 0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.meta{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#2dd4bf}.title{font:900 38px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}.desc{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#a7f3d0}.tag{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#d1fae5}</style>
  </defs>
  <rect width="760" height="250" rx="24" fill="url(#bg)"/>
  <rect x="6" y="6" width="748" height="238" rx="20" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="340 86" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-426" dur="16s" repeatCount="indefinite"/></rect>
  <g transform="translate(85 62)" filter="url(#glow)">
    <!-- RAG Search/Analysis Graphic -->
    <circle cx="20" cy="20" r="30" fill="none" stroke="#2dd4bf" stroke-width="3"/>
    <line x1="41" y1="41" x2="70" y2="70" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <rect x="-10" y="5" width="20" height="6" fill="#22c55e" rx="3"/>
    <rect x="-20" y="20" width="15" height="6" fill="#67e8f9" rx="3"/>
    <rect x="5" y="25" width="20" height="6" fill="#a7f3d0" rx="3"/>
  </g>
  <text x="280" y="74" class="meta">INTELLIGENT REPOSITORY ANALYSIS</text>
  <text x="280" y="126" class="title">REPOLENS AI</text>
  <text x="280" y="161" class="desc">Full-stack RAG system for codebase query and auto code reviews.</text>
  <g transform="translate(280 190)"><rect width="102" height="26" rx="13" fill="#052e2b" stroke="#2dd4bf" stroke-opacity=".55"/><text x="51" y="18" text-anchor="middle" class="tag">PYTHON RAG</text></g>
  <g transform="translate(392 190)"><rect width="90" height="26" rx="13" fill="#052e2b" stroke="#22c55e" stroke-opacity=".55"/><text x="45" y="18" text-anchor="middle" class="tag">AI AGENT</text></g>
</svg>
